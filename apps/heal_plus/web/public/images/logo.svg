<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Vertical Band-aid -->
  <rect x="35" y="5" width="30" height="90" rx="8" fill="#2196f3"/>
  <rect x="35" y="5" width="30" height="90" rx="8" fill="url(#grad1)"/>

  <!-- Horizontal Band-aid -->
  <rect x="5" y="35" width="90" height="30" rx="8" fill="#2196f3"/>
  <rect x="5" y="35" width="90" height="30" rx="8" fill="url(#grad2)"/>

  <!-- Center overlay for depth -->
  <rect x="35" y="35" width="30" height="30" rx="4" fill="#1976d2"/>

  <!-- Dots on vertical band-aid (top) -->
  <circle cx="42" cy="18" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="50" cy="18" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="58" cy="18" r="2.5" fill="#1565c0" opacity="0.6"/>

  <!-- Dots on vertical band-aid (bottom) -->
  <circle cx="42" cy="82" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="50" cy="82" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="58" cy="82" r="2.5" fill="#1565c0" opacity="0.6"/>

  <!-- Dots on horizontal band-aid (left) -->
  <circle cx="18" cy="42" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="18" cy="50" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="18" cy="58" r="2.5" fill="#1565c0" opacity="0.6"/>

  <!-- Dots on horizontal band-aid (right) -->
  <circle cx="82" cy="42" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="82" cy="50" r="2.5" fill="#1565c0" opacity="0.6"/>
  <circle cx="82" cy="58" r="2.5" fill="#1565c0" opacity="0.6"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="35" y1="5" x2="65" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="grad2" x1="5" y1="35" x2="95" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
</svg>
