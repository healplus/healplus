[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "dataset",
  "models",
  "runs",
  "tmp_images",
  "apps/heal_plus/web/node_modules",
]

[tool.ruff.lint]
# Bootstrap gate: keep CI focused on syntax/undefined-name class errors while
# the historical codebase is formatted and modernized in dedicated PRs.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["apps", "packages", "src"]
omit = [
  "tests/*",
  "scripts/*",
  "src/training/*",
  "src/presentation/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = [
  "dataset/",
  "models/",
  "runs/",
  "tmp_images/",
  "apps/heal_plus/web/",
]
