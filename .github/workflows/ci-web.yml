name: CI Web

on:
  push:
    branches: [develop, main, master, treinamento-da-ia]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/heal_plus/web
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_CLINICAL_API_URL: http://localhost:3000/api/clinical
      NEXT_PUBLIC_HEAL_AI_API_URL: http://localhost:5000/api/v1
      GOOGLE_GENAI_API_KEY: demo-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/heal_plus/web/package-lock.json



      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test unit and component behavior
        run: npm test



      - name: Build
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/heal_plus/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/heal_plus/web/package-lock.json



      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic negative journeys
        run: npm run test:e2e

      - name: Upload safe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-synthetic-failures
          path: |
            apps/heal_plus/web/playwright-report
            apps/heal_plus/web/test-results/e2e
          retention-days: 7
