name: CI Python

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    env:
      REDISUS_COVERAGE_MIN: "45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile sources
        run: python -m compileall apps packages src backend scripts main.py heal_platform.py realtime_app.py

      - name: Fatal lint
        run: python -m ruff check apps packages src tests scripts main.py heal_platform.py realtime_app.py

      - name: Format check advisory
        run: python -m ruff format --check apps packages src tests scripts main.py heal_platform.py realtime_app.py
        continue-on-error: true

      - name: Type check
        run: python -m mypy apps packages src
        continue-on-error: true

      - name: Type check image quality
        run: python -m mypy src/image_quality apps/api/routes/image_quality.py --follow-imports=silent

      - name: Run API regression tests
        run: |
          python -m pytest \
            tests/test_clinical_api_contracts.py \
            tests/test_fhir_client.py \
            tests/test_risk_stratification.py \
            tests/test_official_api_factory.py \
            tests/test_api_security.py \
            tests/test_image_quality.py \
            -q \
            --cov=apps \
            --cov=packages \
            --cov=src/interoperability \
            --cov=src/risk \
            --cov=src/image_quality \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${REDISUS_COVERAGE_MIN}"

      - name: Validate image quality resources against official FHIR R4 schema
        run: python scripts/check_image_quality_fhir.py

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: coverage.xml
