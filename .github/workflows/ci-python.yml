name: CI Python

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  api-minimal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install minimum API profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Validate runtime profile contract
        run: python scripts/check_runtime_profiles.py --profile api

      - name: Import headless analyzer without desktop stack
        run: python -c "from src.processing.clinical_wound_analyzer_core import ClinicalWoundAnalyzer; print(ClinicalWoundAnalyzer.__name__)"

      - name: Smoke official API
        env:
          CLINICAL_API_REQUIRE_AUTH: "0"
          REDISUS_DB_PATH: ${{ runner.temp }}/healplus-api-smoke.db
        run: python -c "from apps.heal_plus.api.app import create_app; client = create_app().test_client(); response = client.get('/api/v1/health'); assert response.status_code == 200, response.get_data(as_text=True)"

  python-smoke:
    runs-on: ubuntu-latest
    env:
      REDISUS_COVERAGE_MIN: "45"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile sources
        run: python -m compileall apps packages src backend scripts main.py heal_platform.py realtime_app.py

      - name: Fatal lint
        run: python -m ruff check apps packages src tests scripts main.py heal_platform.py realtime_app.py

      - name: Format check advisory
        run: python -m ruff format --check apps packages src tests scripts main.py heal_platform.py realtime_app.py
        continue-on-error: true

      - name: Type check
        run: python -m mypy apps packages src
        continue-on-error: true

      - name: Run smoke tests
        run: |
          python -m pytest \
            tests/test_clinical_api_contracts.py \
            tests/test_fhir_client.py \
            tests/test_fhir_publication.py \
            tests/test_rnds_connector.py \
            tests/test_risk_stratification.py \
            tests/test_official_api_factory.py \
            tests/test_api_security.py \
            tests/test_negative_authorization.py \
            tests/test_runtime_profiles.py \
            -q \
            --cov=apps \
            --cov=packages \
            --cov=src/interoperability \
            --cov=src/risk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${REDISUS_COVERAGE_MIN}"

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-xml
          path: coverage.xml
