name: CI Supabase

on:
  push:
    branches: [develop, main, master, treinamento-da-ia]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.81.3
      - name: Start isolated Supabase
        run: supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor,imgproxy
      - name: Test ownership and session policies
        run: supabase test db
      - name: Lint database
        run: supabase db lint --local --level error --fail-on error
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
