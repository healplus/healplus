name: CodeQL

on:
  push:
    branches: [develop, main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  code-scanning-availability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check code scanning availability
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("GET /repos/{owner}/{repo}/code-scanning/analyses", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1,
              });
              core.setOutput("enabled", "true");
            } catch (error) {
              core.warning(`Code scanning unavailable for this repository: ${error.message}`);
              core.setOutput("enabled", "false");
            }

  analyze:
    needs: code-scanning-availability
    if: needs.code-scanning-availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  code-scanning-skipped:
    needs: code-scanning-availability
    if: needs.code-scanning-availability.outputs.enabled != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Explain why CodeQL was skipped
        run: |
          echo "CodeQL was skipped because GitHub code scanning is not enabled or not accessible for this repository."
          echo "Enable code scanning in the repository settings if you want CodeQL results uploaded to the Security tab."
