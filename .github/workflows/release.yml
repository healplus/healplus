name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pilot-gate:
    uses: ./.github/workflows/pilot-gate.yml
    with:
      candidate: ${{ github.ref_name }}
      require_go: true

  github-release:
    needs: pilot-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "docs/operations/releases/${GITHUB_REF_NAME}.md"
          test -f "docs/operations/release-evidence/${GITHUB_REF_NAME}.json"
          grep -F "## [${version}]" CHANGELOG.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: docs/operations/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            CHANGELOG.md
            ml/registry/models.yaml
