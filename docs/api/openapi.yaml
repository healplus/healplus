openapi: 3.1.1
info:
  title: HEAL+ / REDISUS Clinical API
  version: 1.0.0
  description: |
    API clínica oficial do HEAL+. A análise de imagem é um recurso de apoio à decisão,
    exige revisão por profissional habilitado e não confirma diagnóstico isoladamente.
servers:
  - url: http://localhost:5000
paths:
  /api/v1/fhir/$validate-image:
    post:
      operationId: validateImageQuality
      summary: Experimental technical image quality assessment using FHIR R4
      description: >-
        Requires a verified bearer token with clinical write role and explicit consent.
        JPEG/PNG only, maximum 10 MiB decoded file, 12 megapixels and 14 MiB HTTP body.
        No persistence, external image URL fetching, patient lookup or clinical diagnosis.
        See image-quality-fhir.md and GET /api/v1/fhir/OperationDefinition/validate-image.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/ImageQualityParameters'
      responses:
        '200':
          description: Completed assessment; technical status accepted, rejected or indeterminate.
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirParameters'
        '400':
          $ref: '#/components/responses/FhirError'
        '401':
          $ref: '#/components/responses/FhirError'
        '403':
          $ref: '#/components/responses/FhirError'
        '406':
          $ref: '#/components/responses/FhirError'
        '413':
          $ref: '#/components/responses/FhirError'
        '415':
          $ref: '#/components/responses/FhirError'
        '422':
          $ref: '#/components/responses/FhirError'
        '429':
          description: Per-user rate or per-worker concurrency limit; Retry-After in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '500':
          $ref: '#/components/responses/FhirError'
        '503':
          $ref: '#/components/responses/FhirError'
  /api/v1/fhir/metadata:
    get:
      summary: FHIR R4 capability statement for image quality operations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Experimental CapabilityStatement with fhirVersion 4.0.1.
        default:
          $ref: '#/components/responses/FhirError'
  /api/v1/fhir/OperationDefinition/validate-image:
    get:
      summary: Computable input and output contract for validate-image
      security:
        - bearerAuth: []
      responses:
        '200':
          description: FHIR R4 OperationDefinition.
        default:
          $ref: '#/components/responses/FhirError'
  /health:
    get:
      summary: Verifica se o processo da API está acessível
      security: []
      responses:
        "200":
          description: API acessível.
  /api/v1/health:
    get:
      summary: Verifica saúde e componentes da API oficial
      security: []
      responses:
        "200":
          description: Estado atual da API.
  /api/v1/wound-analyses/capabilities:
    get:
      summary: Consulta capacidades, runtime, taxonomia e limitações do motor
      operationId: getWoundAnalysisCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Capacidades do runtime atual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoundAnalysisCapabilities"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/wound-analyses:
    post:
      summary: Cria e persiste uma análise de ferida
      operationId: createWoundAnalysis
      description: |
        Aceita imagem com ou sem paciente/avaliação vinculada. ROI manual é opcional.
        Repetir uma requisição com a mesma Idempotency-Key e o mesmo conteúdo retorna
        o recurso já criado; reutilizar a chave com conteúdo diferente retorna 409.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG ou WebP validado por conteúdo.
                patient_id:
                  type: string
                  maxLength: 80
                evaluation_id:
                  type: string
                  maxLength: 80
                roi_payload:
                  type: string
                  description: JSON de uma ROI ou lista de ROIs normalizadas e confirmadas.
      responses:
        "201":
          description: Análise criada e persistida.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoundAnalysis"
        "200":
          description: Replay idempotente de uma análise existente.
          headers:
            X-Idempotent-Replay:
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoundAnalysis"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/wound-analyses/{analysis_id}:
    get:
      summary: Consulta uma análise persistida
      operationId: getWoundAnalysis
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: analysis_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recurso de análise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoundAnalysis"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/analyze:
    post:
      deprecated: true
      summary: Endpoint legado de análise
      description: Use POST /api/v1/wound-analyses.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resposta legada preservada para compatibilidade.
  /api/dashboard/summary:
    get:
      summary: Resumo clínico autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resumo do dashboard.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
components:
  responses:
    FhirError:
      description: FHIR OperationOutcome with safe error details and no uploaded content.
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase JWT
  responses:
    Problem:
      description: Erro HTTP no formato Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    FhirError:
      description: FHIR OperationOutcome with safe error details and no uploaded content.
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
  schemas:
    ImageQualityParameters:
      type: object
      additionalProperties: false
      required: [resourceType, parameter]
      properties:
        resourceType:
          type: string
          enum: [Parameters]
        parameter:
          type: array
          minItems: 3
          maxItems: 3
          description: Exactly one of each input parameter; duplicates rejected by the server.
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [name, valueString]
                properties:
                  name:
                    type: string
                    enum: [imageId]
                  valueString:
                    type: string
                    pattern: '^[A-Za-z0-9._:-]{8,128}$'
              - type: object
                additionalProperties: false
                required: [name, valueBoolean]
                properties:
                  name:
                    type: string
                    enum: [consent]
                  valueBoolean:
                    type: boolean
                    enum: [true]
              - type: object
                additionalProperties: false
                required: [name, valueAttachment]
                properties:
                  name:
                    type: string
                    enum: [image]
                  valueAttachment:
                    type: object
                    additionalProperties: false
                    required: [contentType, data]
                    properties:
                      contentType:
                        type: string
                        enum: [image/jpeg, image/png]
                      data:
                        type: string
                        format: byte
                        minLength: 1
                        maxLength: 13981016
    FhirParameters:
      type: object
      required: [resourceType, parameter]
      properties:
        resourceType:
          type: string
          enum: [Parameters]
        parameter:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
    OperationOutcome:
      type: object
      required: [resourceType, issue]
      properties:
        resourceType:
          type: string
          enum: [OperationOutcome]
        issue:
          type: array
          minItems: 1
          items:
            type: object
            required: [severity, code]
            properties:
              severity:
                type: string
                enum: [fatal, error, warning, information]
              code:
                type: string
              details:
                type: object
                properties:
                  text:
                    type: string
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        error:
          type: string
          description: Alias temporário de code para clientes legados.
        request_id:
          type: string
    WoundAnalysisCapabilities:
      type: object
      required: [service, resource, api_version, contract_version, runtime, inputs, outputs, clinical_use]
      properties:
        service:
          type: string
        resource:
          type: string
          const: wound_analysis
        api_version:
          type: string
        contract_version:
          type: string
        runtime:
          type: object
        inputs:
          type: object
        outputs:
          type: object
        clinical_use:
          type: object
        evidence_basis:
          type: array
          items:
            type: object
    WoundAnalysis:
      type: object
      additionalProperties: true
      required:
        - resource_type
        - api_version
        - contract_version
        - analysis_id
        - status
        - generated_at
        - model_version
        - subject
        - execution
        - safety
        - is_valid_wound
        - tissues
        - inference
        - interpretation
        - metadata
        - links
      properties:
        resource_type:
          type: string
          const: wound_analysis
        api_version:
          type: string
        contract_version:
          type: string
        analysis_id:
          type: string
        status:
          type: string
          const: completed
        generated_at:
          type: string
          format: date-time
        model_version:
          type: string
        subject:
          type: object
          required: [patient_id, evaluation_id]
          properties:
            patient_id:
              type: [string, "null"]
            evaluation_id:
              type: [string, "null"]
        execution:
          type: object
          required: [engine, mode, degraded, processing_time_ms, components, warnings]
          properties:
            engine:
              type: string
            mode:
              type: string
              enum: [model_assisted, deterministic_fallback]
            degraded:
              type: boolean
            processing_time_ms:
              type: number
              minimum: 0
            components:
              type: object
              additionalProperties:
                type: string
            warnings:
              type: array
              items:
                type: string
        safety:
          type: object
          required: [intended_use, decision_support_only, clinician_review_required, limitations]
          properties:
            intended_use:
              type: string
            decision_support_only:
              type: boolean
              const: true
            clinician_review_required:
              type: boolean
              const: true
            regulatory_status:
              type: string
            limitations:
              type: array
              items:
                type: string
        is_valid_wound:
          type: boolean
        rejection_reason:
          type: string
        wound_area_px:
          type: integer
          minimum: 0
        tissues:
          type: array
          items:
            type: object
            required: [name, name_en, percentage, color_hex]
            properties:
              name:
                type: string
              name_en:
                type: string
              percentage:
                type: number
                minimum: 0
                maximum: 100
              color_hex:
                type: string
        inference:
          type: object
        interpretation:
          type: object
        metadata:
          type: object
        visuals:
          type: object
        links:
          type: object
          required: [self, capabilities]
          properties:
            self:
              type: string
            capabilities:
              type: string
